# Step 17 - every push / PR proves a clean checkout migrates, tests, builds and audits.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      TDM_AUTH_MODE: development           # tests use X-Dev headers; production paths are tested explicitly
      TDM_DATA_DIR: ${{ runner.temp }}/tdm-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.5"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies (incl. spaCy en_core_web_sm)
        run: pip install -r requirements-dev.txt
      - name: Lint (syntax errors, undefined names)
        run: ruff check --select E9,F63,F7,F82 --exclude frontend-react .
      - name: Migrate a fresh database to head, down to base, and back
        run: |
          mkdir -p "$TDM_DATA_DIR"
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic current
      - name: Test suite (contract, migrations, security, privacy)
        run: python -m pytest -q
      - name: Dependency vulnerability audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: npm audit (high and above fail the build)
        run: npm audit --audit-level=high

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tdm-api:ci
      - name: Build web image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: frontend-react
          push: false
          tags: tdm-web:ci
