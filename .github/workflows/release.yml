# Step 17 - tag v*.*.* to release: build + push images, deploy to staging, smoke test,
# then production behind a required-reviewer environment. The "Deploy" steps are the
# one place to plug in your platform (kubectl / helm / Render / ECS ...).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/tdm-api:${{ steps.meta.outputs.tag }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend-react
          push: true
          build-args: VITE_API_BASE=${{ vars.PRODUCTION_API_URL }}
          tags: ghcr.io/${{ github.repository }}/tdm-web:${{ steps.meta.outputs.tag }}

  staging:
    needs: images
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: echo "Deploy ghcr.io/${{ github.repository }}/tdm-api:${{ needs.images.outputs.tag }} to staging (platform-specific)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.5"
      - name: Smoke test
        run: |
          pip install httpx
          python scripts/smoke_test.py "${{ vars.STAGING_API_URL }}" --token "${{ secrets.STAGING_SMOKE_TOKEN }}"

  production:
    needs: [images, staging]
    runs-on: ubuntu-latest
    environment: production          # configure required reviewers on this environment
    steps:
      - uses: actions/checkout@v4
      - name: Back up the metadata store before migrating
        run: echo "Run scripts/backup_metadata.py backup on the production host (platform-specific)"
      - name: Deploy
        run: echo "Deploy ghcr.io/${{ github.repository }}/tdm-api:${{ needs.images.outputs.tag }} to production (platform-specific)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.5"
      - name: Smoke test
        run: |
          pip install httpx
          python scripts/smoke_test.py "${{ vars.PRODUCTION_API_URL }}" --token "${{ secrets.PRODUCTION_SMOKE_TOKEN }}"
